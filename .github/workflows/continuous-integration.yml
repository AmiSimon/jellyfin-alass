name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore SubtitleSync.sln

    - name: Build all projects
      run: |
        dotnet build SubtitleSync.sln \
          --configuration Release \
          --no-restore \
          --verbosity minimal

    - name: Run unit tests
      run: |
        dotnet test tests/SubtitleSync.Core.Tests/SubtitleSync.Core.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Test-Results
        path: **/TestResults/
        retention-days: 7

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage
        path: **/coverage.*
        retention-days: 7

  build-plugins:
    name: Build Plugins
    runs-on: ubuntu-latest
    needs: ci
    
    strategy:
      matrix:
        platform: [jellyfin, emby]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build plugin
      run: |
        PLATFORM=${{ matrix.platform }}
        dotnet build src/SubtitleSync.${PLATFORM}/SubtitleSync.${PLATFORM}.csproj \
          --configuration Release \
          --output ./artifacts/${PLATFORM}

    - name: Copy manifest files
      run: |
        PLATFORM=${{ matrix.platform }}
        if [ "$PLATFORM" = "jellyfin" ]; then
          cp src/SubtitleSync.${PLATFORM}/plugin.json ./artifacts/${PLATFORM}/
        else
          cp src/SubtitleSync.${PLATFORM}/manifest.json ./artifacts/${PLATFORM}/
        fi

    - name: Upload plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubtitleSync-${{ matrix.platform }}
        path: ./artifacts/${{ matrix.platform }}/
        retention-days: 30

  create-release:
    name: Create Release
    needs: build-plugins
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Create release packages
      run: |
        mkdir -p ./release
        
        # Create Jellyfin package
        mkdir -p ./release/SubtitleSync-Jellyfin
        cp ./artifacts/SubtitleSync-jellyfin/* ./release/SubtitleSync-Jellyfin/
        cd ./release/SubtitleSync-Jellyfin && zip -r ../SubtitleSync-Jellyfin.zip * && cd ../..
        
        # Create Emby package
        mkdir -p ./release/SubtitleSync-Emby
        cp ./artifacts/SubtitleSync-emby/* ./release/SubtitleSync-Emby/
        cd ./release/SubtitleSync-Emby && zip -r ../SubtitleSync-Emby.zip * && cd ../..

    - name: Get version from project
      id: version
      run: |
        VERSION=$(grep -oP '<AssemblyVersion>\K[^<]+' src/SubtitleSync.Jellyfin/SubtitleSync.Jellyfin.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: SubtitleSync v${{ steps.version.outputs.version }}
        body: |
          Automatic release for SubtitleSync plugin
          
          **Changes:**
          - See commit history for details
          
          **Compatibility:**
          - Jellyfin 10.8+
          - Emby 4.7+
        files: |
          ./release/SubtitleSync-Jellyfin.zip
          ./release/SubtitleSync-Emby.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
