name: Nightly Build

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual nightly build'

concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore SubtitleSync.sln

    - name: Build all projects
      run: |
        dotnet build SubtitleSync.sln \
          --configuration Release \
          --no-restore \
          --verbosity minimal

    - name: Run tests
      run: |
        dotnet test tests/SubtitleSync.Core.Tests/SubtitleSync.Core.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal

    - name: Build Jellyfin plugin
      run: |
        dotnet build src/SubtitleSync.Jellyfin/SubtitleSync.Jellyfin.csproj \
          --configuration Release \
          --no-restore \
          --output ./artifacts/jellyfin

    - name: Build Emby plugin
      run: |
        dotnet build src/SubtitleSync.Emby/SubtitleSync.Emby.csproj \
          --configuration Release \
          --no-restore \
          --output ./artifacts/emby

    - name: Copy manifest files
      run: |
        cp src/SubtitleSync.Jellyfin/plugin.json ./artifacts/jellyfin/
        cp src/SubtitleSync.Emby/manifest.json ./artifacts/emby/

    - name: Create nightly packages
      run: |
        mkdir -p ./nightly
        
        # Create Jellyfin nightly package
        cd ./artifacts/jellyfin && zip -r ../../nightly/SubtitleSync-Jellyfin-nightly.zip * && cd ../..
        
        # Create Emby nightly package
        cd ./artifacts/emby && zip -r ../../nightly/SubtitleSync-Emby-nightly.zip * && cd ../..

    - name: Get timestamp for nightly build
      id: timestamp
      run: |
        TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

    - name: Create nightly release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly-${{ steps.timestamp.outputs.timestamp }}
        name: SubtitleSync Nightly Build (${{ steps.timestamp.outputs.timestamp }})
        body: |
          **Nightly Build** - Automated build from latest commit
          
          **Build Time:** ${{ steps.timestamp.outputs.timestamp }} UTC
          **Commit:** ${{ github.sha }}
          
          **Note:** Nightly builds are development snapshots and may contain bugs.
          
          **Compatibility:**
          - Jellyfin 10.8+
          - Emby 4.7+
        files: |
          ./nightly/SubtitleSync-Jellyfin-nightly.zip
          ./nightly/SubtitleSync-Emby-nightly.zip
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup old nightly releases
      uses: dev-drprasad/delete-older-releases@v0.3.2
      with:
        keep_latest: 7
        delete_tags: true
        delete_tag_pattern: "nightly-*"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
