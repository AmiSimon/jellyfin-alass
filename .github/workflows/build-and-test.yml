name: Build and Test

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore SubtitleSync.sln --configfile nuget.config

    - name: Build solution
      run: dotnet build SubtitleSync.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test tests/SubtitleSync.Core.Tests/SubtitleSync.Core.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Build Jellyfin plugin
      run: dotnet build src/SubtitleSync.Jellyfin/SubtitleSync.Jellyfin.csproj --configuration Release --no-restore --output ./artifacts/jellyfin

    - name: Build Emby plugin
      run: dotnet build src/SubtitleSync.Emby/SubtitleSync.Emby.csproj --configuration Release --no-restore --output ./artifacts/emby

    - name: Create Jellyfin artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubtitleSync-Jellyfin
        path: |
          ./artifacts/jellyfin/SubtitleSync.Jellyfin.dll
          ./src/SubtitleSync.Jellyfin/plugin.json
        retention-days: 30

    - name: Create Emby artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubtitleSync-Emby
        path: |
          ./artifacts/emby/SubtitleSync.Emby.dll
          ./src/SubtitleSync.Emby/manifest.json
        retention-days: 30

  release:
    name: Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download Jellyfin artifact
      uses: actions/download-artifact@v4
      with:
        name: SubtitleSync-Jellyfin
        path: ./release/jellyfin

    - name: Download Emby artifact
      uses: actions/download-artifact@v4
      with:
        name: SubtitleSync-Emby
        path: ./release/emby

    - name: Create release zip for Jellyfin
      run: |
        mkdir -p ./release/zips
        cd ./release/jellyfin && zip ../zips/SubtitleSync-Jellyfin.zip * && cd ../..

    - name: Create release zip for Emby
      run: |
        cd ./release/emby && zip ../zips/SubtitleSync-Emby.zip * && cd ../..

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Release-Zips
        path: ./release/zips/
        retention-days: 90

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dotnet-format
      run: dotnet tool install -g dotnet-format

    - name: Check formatting
      run: dotnet format --verify-no-changes --severity info SubtitleSync.sln
